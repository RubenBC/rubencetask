<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1A73E8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mis Tareas" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>Mis Tareas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue:       #1A73E8;
    --blue-light: #E8F0FE;
    --blue-dark:  #1A4CAA;
    --surface:    #F0F4F9;
    --card:       #FFFFFF;
    --text:       #202124;
    --text-2:     #5F6368;
    --text-3:     #9AA0A6;
    --border:     #E8EAED;
    --shadow-sm:  0 1px 6px rgba(0,0,0,.06);
    --shadow-md:  0 4px 20px rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--surface);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #C4C7C5; border-radius: 4px; }

  #app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 110px;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1A73E8 0%, #4A90E2 100%);
    border-radius: 0 0 32px 32px;
    padding: 52px 22px 26px;
    margin-bottom: 18px;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .header-date  { color: #C2E7FF; font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .header-title { color: white; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .counter-badge {
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 6px 12px;
    color: white;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .progress-bar  { background: rgba(255,255,255,.25); border-radius: 999px; height: 6px; overflow: hidden; margin-bottom: 5px; }
  .progress-fill { height: 100%; background: white; border-radius: 999px; transition: width .4s ease; }
  .progress-label { color: rgba(255,255,255,.75); font-size: 11px; font-weight: 500; }

  /* Search */
  .search-wrap {
    margin-top: 14px;
    background: white;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  #search-input {
    border: none; outline: none; flex: 1;
    font-size: 14px; color: var(--text);
    font-family: 'DM Sans', sans-serif; background: transparent;
  }
  .search-clear {
    border: none; background: none; cursor: pointer;
    color: var(--text-3); font-size: 20px; padding: 0; line-height: 1; display: none;
  }

  /* ── Body ── */
  .body { padding: 0 16px; }

  /* ── Filtros deslizables ── */
  .filters-outer {
    position: relative;
    margin-bottom: 16px;
  }
  /* Fade derecho para indicar scroll */
  .filters-outer::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 4px;
    width: 40px;
    background: linear-gradient(to right, transparent, var(--surface));
    pointer-events: none;
    border-radius: 0 999px 999px 0;
  }
  .filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 4px;
    padding-right: 32px;        /* espacio para el fade */
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-chip {
    border: 2px solid transparent;
    background: var(--border);
    color: var(--text-2);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
    font-family: 'DM Sans', sans-serif;
    scroll-snap-align: start;
    flex-shrink: 0;
  }
  .filter-chip.active-all {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue-dark);
  }

  /* ── Listas ── */
  #task-list, #done-list { display: flex; flex-direction: column; gap: 10px; }

  /* ── Task card ── */
  .task-card {
    background: var(--card);
    border-radius: 20px;
    padding: 13px 14px;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    box-shadow: var(--shadow-sm);
    border: 2px solid transparent;
    transition: box-shadow .2s, transform .2s, opacity .2s;
    animation: fadeIn .22s ease both;
  }
  .task-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .task-card.pinned   { border-color: #C2E7FF; }
  .task-card.done-card { opacity: .6; }

  .cb {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid #BDC1C6; background: white;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
    transition: all .15s; font-size: 13px; color: white; font-weight: 700;
  }
  .cb.checked { background: var(--blue); border-color: var(--blue); }

  .task-content { flex: 1; min-width: 0; }
  .task-text {
    font-size: 15px; font-weight: 500; line-height: 1.4;
    color: var(--text); word-break: break-word;
  }
  .task-text.done-text { text-decoration: line-through; color: var(--text-3); }

  .task-meta {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 7px; align-items: center;
  }

  .tag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 2px 9px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .tag-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .reminder-badge {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 2px 8px;
    font-size: 11px; font-weight: 500;
  }
  .reminder-badge.ok      { background: #E8F0FE; color: #1A4CAA; }
  .reminder-badge.overdue { background: #FCE8E6; color: #C5221F; }

  .task-actions {
    display: flex; flex-direction: column; gap: 3px;
    opacity: 0; transition: opacity .18s;
  }
  .task-card:hover .task-actions { opacity: 1; }
  @media (hover: none) { .task-actions { opacity: 1; } }  /* siempre visible en touch */

  .task-action-btn {
    border: none; background: none; cursor: pointer;
    font-size: 15px; padding: 2px; color: var(--text-3); line-height: 1;
    transition: transform .1s;
  }
  .task-action-btn:active { transform: scale(1.2); }
  .task-action-btn.pin-active { color: var(--blue); }

  /* ── Completadas ── */
  .done-header {
    display: flex; align-items: center; gap: 8px;
    margin: 22px 0 10px; cursor: pointer; user-select: none;
  }
  .done-arrow {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 999px;
    width: 22px; height: 22px; font-size: 10px;
    transition: transform .2s; border: none; cursor: pointer;
  }
  .done-arrow.open { transform: rotate(90deg); }
  .done-title { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .clear-btn {
    margin-left: auto; font-size: 11px; color: #EA4335;
    text-decoration: underline; cursor: pointer;
    background: none; border: none; font-family: 'DM Sans', sans-serif; font-weight: 500;
  }

  /* ── Empty ── */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-3); }
  .empty-emoji { font-size: 48px; margin-bottom: 10px; }
  .empty-title { font-weight: 600; font-size: 15px; }
  .empty-sub   { font-size: 13px; margin-top: 4px; }

  /* ── Banner notificaciones ── */
  #notif-banner {
    display: none;
    background: #FFF8E1; border-radius: 14px;
    padding: 10px 14px; margin-bottom: 14px;
    font-size: 13px; color: #7A5A00; font-weight: 500;
    align-items: center; gap: 10px;
  }
  #notif-banner.show { display: flex; }
  #notif-banner button {
    border: none; background: #FBBC04; color: white;
    border-radius: 8px; padding: 5px 12px; font-size: 12px;
    font-weight: 700; cursor: pointer; white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
  }

  /* ── FAB ── */
  #fab {
    position: fixed; bottom: 28px;
    right: max(28px, calc(50% - 232px));
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, #1A73E8, #4A90E2);
    border: none; cursor: pointer;
    box-shadow: 0 6px 20px rgba(26,115,232,.38);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: white;
    transition: all .2s cubic-bezier(.34,1.56,.64,1);
    z-index: 50; line-height: 1;
  }
  #fab:hover  { transform: scale(1.08); box-shadow: 0 10px 30px rgba(26,115,232,.45); }
  #fab:active { transform: scale(.95); }

  /* ── Modal ── */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.32); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: #F8F9FF; border-radius: 28px 28px 0 0;
    padding: 26px 22px 40px; width: 100%; max-width: 520px;
    box-shadow: 0 -8px 40px rgba(0,0,0,.15);
    animation: slideUp .26s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-handle {
    width: 40px; height: 4px; background: #BDC1C6;
    border-radius: 2px; margin: 0 auto 18px;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 14px; }

  #task-input {
    width: 100%; border: none; outline: none;
    background: white; border-radius: 16px; padding: 12px 14px;
    font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--text);
    resize: none; min-height: 72px;
    box-shadow: var(--shadow-sm); line-height: 1.5;
  }
  .field-label {
    font-size: 12px; font-weight: 600; color: var(--text-2);
    display: block; margin: 12px 0 6px;
  }
  #reminder-input {
    width: 100%; border: none; outline: none;
    background: white; border-radius: 12px; padding: 9px 12px;
    font-size: 13px; color: var(--text);
    box-shadow: var(--shadow-sm); font-family: 'DM Sans', sans-serif;
  }
  .tag-selector { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-sel-btn {
    border: 2px solid transparent; border-radius: 999px;
    padding: 4px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s; font-family: 'DM Sans', sans-serif;
  }
  .tag-sel-btn.sel { box-shadow: 0 2px 8px rgba(0,0,0,.18); }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-cancel {
    flex: 1; padding: 12px; border: none; border-radius: 14px;
    background: var(--border); color: var(--text-2);
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  #btn-add {
    flex: 2; padding: 12px; border: none; border-radius: 14px;
    background: var(--blue); color: white;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    box-shadow: 0 4px 14px rgba(26,115,232,.35); transition: all .15s;
  }
  #btn-add:disabled { background: #BDC1C6; box-shadow: none; cursor: default; }

  /* ── Animations ── */
  @keyframes fadeIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-date"  id="header-date"></div>
        <div class="header-title">Mis tareas</div>
      </div>
      <div class="counter-badge" id="counter-badge">0/0 ✓</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0% completado</div>
    <div class="search-wrap">
      <span style="font-size:15px">🔍</span>
      <input id="search-input" type="search" placeholder="Buscar tareas…" autocomplete="off" />
      <button class="search-clear" id="search-clear">×</button>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- Banner permiso notificaciones -->
    <div id="notif-banner">
      <span>🔔 Activa las notificaciones para recibir recordatorios</span>
      <button id="notif-btn">Activar</button>
    </div>

    <!-- Filtros -->
    <div class="filters-outer">
      <div class="filters" id="filters"></div>
    </div>

    <!-- Lista pendientes -->
    <div id="task-list"></div>
    <div id="empty-state" class="empty" style="display:none">
      <div class="empty-emoji">🎉</div>
      <div class="empty-title">¡Todo listo!</div>
      <div class="empty-sub">No hay tareas pendientes</div>
    </div>

    <!-- Completadas -->
    <div id="done-section" style="display:none">
      <div class="done-header" id="done-header">
        <button class="done-arrow" id="done-arrow">▶</button>
        <span class="done-title" id="done-title">Completadas (0)</span>
        <button class="clear-btn" id="clear-btn">Limpiar</button>
      </div>
      <div id="done-list" style="display:none;flex-direction:column;gap:10px"></div>
    </div>

  </div>
</div>

<!-- FAB -->
<button id="fab">+</button>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nueva tarea</div>
    <textarea id="task-input" placeholder="¿Qué tienes pendiente?" rows="3"></textarea>
    <label class="field-label">🔔 Recordatorio (opcional)</label>
    <input type="datetime-local" id="reminder-input" />
    <label class="field-label">🏷️ Etiquetas</label>
    <div class="tag-selector" id="tag-selector"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Cancelar</button>
      <button id="btn-add" disabled>Agregar tarea</button>
    </div>
  </div>
</div>

<script>
// ── Constantes ────────────────────────────────────────────────────────────────
const TAGS = [
  { id:"personal", label:"Personal",  bg:"#F2E8FF", text:"#6B3FA0", dot:"#9C5FDB" },
  { id:"trabajo",  label:"Trabajo",   bg:"#E8F0FE", text:"#1A4CAA", dot:"#4285F4" },
  { id:"salud",    label:"Salud",     bg:"#E6F4EA", text:"#1E6A35", dot:"#34A853" },
  { id:"hogar",    label:"Hogar",     bg:"#FEF3E2", text:"#8B4513", dot:"#FF8C00" },
  { id:"urgente",  label:"Urgente",   bg:"#FCE8E6", text:"#9B1B1B", dot:"#EA4335" },
  { id:"ideas",    label:"Ideas",     bg:"#FFF8E1", text:"#7A5A00", dot:"#FBBC04" },
];

const LS_KEY = 'mis-tareas-v1';

// ── Estado ────────────────────────────────────────────────────────────────────
let tasks = JSON.parse(localStorage.getItem(LS_KEY) || 'null') || [
  { id:1, text:"Revisar el plan de riego de HuertApp", done:false, tags:["trabajo","hogar"],   reminder:"2026-05-25T09:00", pinned:true  },
  { id:2, text:"Sesión de bici estacionaria 30 min",   done:false, tags:["salud"],             reminder:"2026-05-25T07:30", pinned:false },
  { id:3, text:"Comprar bandas de resistencia nuevas", done:true,  tags:["salud","personal"],  reminder:"",                pinned:false },
  { id:4, text:"Preparar reporte semanal",             done:false, tags:["trabajo","urgente"], reminder:"2026-05-26T18:00", pinned:false },
];

let filterTag  = "all";
let showDone   = false;
let searchText = "";
let swReg      = null;
let selTags    = [];

function save() { localStorage.setItem(LS_KEY, JSON.stringify(tasks)); }
function getTag(id) { return TAGS.find(t => t.id === id) || TAGS[0]; }
function nextId()   { return tasks.length ? Math.max(...tasks.map(t=>t.id))+1 : 1; }

function formatReminder(dt) {
  if (!dt) return null;
  const d   = new Date(dt), now = new Date();
  const isToday    = d.toDateString() === now.toDateString();
  const isTomorrow = d.toDateString() === new Date(now.getTime()+86400000).toDateString();
  const time = d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
  if (isToday)    return `Hoy, ${time}`;
  if (isTomorrow) return `Mañana, ${time}`;
  return d.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+`, ${time}`;
}
function isOverdue(dt) { return dt && new Date(dt) < new Date(); }

// ── Service Worker & Notificaciones ──────────────────────────────────────────
async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register('/sw.js');
    console.log('[App] SW registrado');
    // Pedir al SW que recargue recordatorios guardados en IDB
    const sw = swReg.active || swReg.installing || swReg.waiting;
    if (sw) sw.postMessage({ type:'RESCHEDULE' });
  } catch(e) { console.warn('[App] SW error:', e); }
}

function checkNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    document.getElementById('notif-banner').classList.add('show');
  }
}

async function requestNotifPermission() {
  const perm = await Notification.requestPermission();
  document.getElementById('notif-banner').classList.remove('show');
  if (perm === 'granted') syncRemindersToSW();
}

function swPost(msg) {
  if (!swReg) return;
  const sw = swReg.active || swReg.installing || swReg.waiting;
  if (sw) sw.postMessage(msg);
}

function syncRemindersToSW() {
  if (Notification.permission !== 'granted') return;
  tasks.filter(t => !t.done && t.reminder && !isOverdue(t.reminder)).forEach(t => {
    swPost({ type:'ADD_REMINDER', reminder:{ id:t.id, text:t.text, dt:t.reminder } });
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  let visible = tasks;
  if (searchText) visible = visible.filter(t => t.text.toLowerCase().includes(searchText.toLowerCase()));
  if (filterTag !== "all") visible = visible.filter(t => t.tags.includes(filterTag));

  const pending = visible.filter(t=>!t.done).sort((a,b)=>b.pinned-a.pinned);
  const done    = visible.filter(t=> t.done);

  const total = tasks.length, doneCount = tasks.filter(t=>t.done).length;
  const pct   = total > 0 ? Math.round(doneCount/total*100) : 0;

  document.getElementById("header-date").textContent =
    new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("counter-badge").textContent = `${doneCount}/${total} ✓`;
  document.getElementById("progress-fill").style.width = pct+"%";
  document.getElementById("progress-label").textContent = `${pct}% completado`;
  document.getElementById("search-clear").style.display = searchText ? "block" : "none";

  buildFilters();

  const tl = document.getElementById("task-list");
  tl.innerHTML = "";
  pending.forEach(t => tl.appendChild(buildCard(t)));

  document.getElementById("empty-state").style.display =
    (!pending.length && !searchText) ? "block" : "none";

  const ds = document.getElementById("done-section");
  ds.style.display = done.length ? "block" : "none";
  document.getElementById("done-title").textContent = `Completadas (${done.length})`;

  const dl = document.getElementById("done-list");
  dl.innerHTML = "";
  done.forEach(t => dl.appendChild(buildCard(t)));
  dl.style.display = showDone ? "flex" : "none";
  document.getElementById("done-arrow").classList.toggle("open", showDone);
}

function buildFilters() {
  const wrap = document.getElementById("filters");
  wrap.innerHTML = "";

  const allBtn = el("button","filter-chip"+(filterTag==="all"?" active-all":""));
  allBtn.dataset.tag = "all"; allBtn.textContent = "Todas";
  allBtn.onclick = () => { filterTag="all"; render(); };
  wrap.appendChild(allBtn);

  TAGS.forEach(tag => {
    const btn = el("button","filter-chip");
    btn.textContent = tag.label;
    const active = filterTag === tag.id;
    if (active) { btn.style.borderColor=tag.dot; btn.style.background=tag.bg; btn.style.color=tag.text; }
    btn.onclick = () => { filterTag = filterTag===tag.id?"all":tag.id; render(); };
    wrap.appendChild(btn);
  });
}

function buildCard(task) {
  const card = el("div","task-card"+(task.pinned?" pinned":"")+(task.done?" done-card":""));

  // Checkbox
  const cb = el("button","cb"+(task.done?" checked":""));
  cb.innerHTML = task.done ? "✓" : "";
  cb.onclick = () => toggleDone(task.id);
  card.appendChild(cb);

  // Content
  const content = el("div","task-content");
  const txt = el("div","task-text"+(task.done?" done-text":""));
  txt.textContent = task.text;
  content.appendChild(txt);

  if (task.reminder || task.tags.length) {
    const meta = el("div","task-meta");
    if (task.reminder) {
      const rb = el("span","reminder-badge "+(isOverdue(task.reminder)?"overdue":"ok"));
      rb.innerHTML = (isOverdue(task.reminder)?"⚠️ ":"🔔 ")+formatReminder(task.reminder);
      meta.appendChild(rb);
    }
    task.tags.forEach(tid => {
      const tag = getTag(tid);
      const chip = el("span","tag-chip");
      chip.style.background = tag.bg; chip.style.color = tag.text;
      chip.innerHTML = `<span class="tag-dot" style="background:${tag.dot}"></span>${tag.label}`;
      meta.appendChild(chip);
    });
    content.appendChild(meta);
  }
  card.appendChild(content);

  // Actions
  const acts = el("div","task-actions");
  const pin  = el("button","task-action-btn"+(task.pinned?" pin-active":""));
  pin.title   = task.pinned?"Desanclar":"Anclar"; pin.textContent = "📌";
  pin.onclick = () => pinTask(task.id);

  const del  = el("button","task-action-btn");
  del.title   = "Eliminar"; del.textContent = "🗑️";
  del.onclick = () => deleteTask(task.id);

  acts.appendChild(pin); acts.appendChild(del);
  card.appendChild(acts);
  return card;
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// ── Acciones ──────────────────────────────────────────────────────────────────
function toggleDone(id) {
  tasks = tasks.map(t => {
    if (t.id !== id) return t;
    if (!t.done && t.reminder) swPost({type:'REMOVE_REMINDER', id:t.id}); // cancelar si se completa
    return {...t, done:!t.done};
  });
  save(); render();
}

function pinTask(id)    { tasks = tasks.map(t=>t.id===id?{...t,pinned:!t.pinned}:t); save(); render(); }
function deleteTask(id) {
  swPost({type:'REMOVE_REMINDER', id});
  tasks = tasks.filter(t=>t.id!==id); save(); render();
}
function clearDone()    { tasks = tasks.filter(t=>!t.done); showDone=false; save(); render(); }

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal() {
  selTags = [];
  document.getElementById("task-input").value     = "";
  document.getElementById("reminder-input").value = "";
  document.getElementById("btn-add").disabled     = true;
  buildTagSel();
  document.getElementById("modal-overlay").classList.add("open");
  setTimeout(()=>document.getElementById("task-input").focus(),120);
}
function closeModal() { document.getElementById("modal-overlay").classList.remove("open"); }

function buildTagSel() {
  const wrap = document.getElementById("tag-selector");
  wrap.innerHTML = "";
  TAGS.forEach(tag => {
    const btn = el("button","tag-sel-btn");
    btn.style.background = tag.bg; btn.style.color = tag.text;
    btn.textContent = tag.label;
    btn.onclick = () => {
      const on = selTags.includes(tag.id);
      selTags = on ? selTags.filter(t=>t!==tag.id) : [...selTags,tag.id];
      btn.style.borderColor = on ? "transparent" : tag.dot;
      btn.classList.toggle("sel",!on);
    };
    wrap.appendChild(btn);
  });
}

function addTask() {
  const text = document.getElementById("task-input").value.trim();
  if (!text) return;
  const reminder = document.getElementById("reminder-input").value;
  const task = { id:nextId(), text, reminder, tags:[...selTags], done:false, pinned:false };
  tasks.unshift(task);
  save();

  // Enviar recordatorio al SW si hay fecha futura y permisos
  if (reminder && !isOverdue(reminder) && Notification.permission === 'granted') {
    swPost({ type:'ADD_REMINDER', reminder:{ id:task.id, text:task.text, dt:reminder } });
  }

  closeModal(); render();
}

// ── Eventos ───────────────────────────────────────────────────────────────────
document.getElementById("fab").onclick         = openModal;
document.getElementById("btn-cancel").onclick  = closeModal;
document.getElementById("btn-add").onclick     = addTask;
document.getElementById("clear-btn").onclick   = clearDone;
document.getElementById("notif-btn").onclick   = requestNotifPermission;

document.getElementById("modal-overlay").onclick = e => {
  if (e.target === document.getElementById("modal-overlay")) closeModal();
};
document.getElementById("task-input").addEventListener("input", function() {
  document.getElementById("btn-add").disabled = !this.value.trim();
});
document.getElementById("task-input").addEventListener("keydown", function(e) {
  if (e.key==="Enter"&&!e.shiftKey) { e.preventDefault(); addTask(); }
});
document.getElementById("search-input").addEventListener("input", function() {
  searchText = this.value; render();
});
document.getElementById("search-clear").onclick = () => {
  searchText = ""; document.getElementById("search-input").value = ""; render();
};
document.getElementById("done-header").onclick = e => {
  if (e.target===document.getElementById("clear-btn")) return;
  showDone = !showDone; render();
};

// ── Init ──────────────────────────────────────────────────────────────────────
render();
registerSW();
checkNotifPermission();
// Sincronizar recordatorios pendientes al abrir la app
setTimeout(syncRemindersToSW, 800);
</script>
</body>
</html>
